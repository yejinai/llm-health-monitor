<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Health Monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 16px; min-width: 90px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 11px; color: #8b949e; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .ok          { background: #1a4d2e33; color: #3fb950; }
  .slow        { background: #bb800933; color: #d29922; }
  .error       { background: #da363333; color: #f85149; }
  .unavailable { background: #6e768166; color: #8b949e; }
  .skipped     { background: #21262d;   color: #6e7681; }
  .err { color: #8b949e; font-size: 11px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 12px; }
  button:hover { background: #30363d; }
  .alert { background: #da363322; border: 1px solid #f8514966; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .alert strong { color: #f85149; }
  .official-note { font-size: 11px; color: #8b949e; margin-top: 2px; }
  details.keys { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  details.keys summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .keyrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .keyrow .pname { min-width: 90px; font-size: 13px; font-weight: 600; }
  .keyrow input { flex: 1; min-width: 220px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-family: monospace; }
  .keysrc { font-size: 10px; padding: 2px 8px; border-radius: 999px; }
  .keysrc.ui  { background: #1a4d2e33; color: #3fb950; }
  .keysrc.env { background: #0d419d33; color: #58a6ff; }
  .keysrc.none{ background: #21262d;   color: #6e7681; }
  .keynote { font-size: 11px; color: #8b949e; margin-top: 8px; }
</style>
</head>
<body>
  <h1>🩺 LLM Health Monitor</h1>
  <div class="sub">Last checked: <span id="checkedAt">–</span>
    &nbsp;<button onclick="recheck()">Re-check now</button></div>
  <div id="alerts"></div>
  <details class="keys" id="keysSection">
    <summary>🔑 API keys</summary>
    <div id="keyRows"></div>
    <div class="keynote">Keys are stored locally in <code>data/keys.json</code> (gitignored) and only masked
    previews are shown. Management works from this machine only (localhost). Environment variables
    still work as a fallback for servers.</div>
  </details>
  <div class="summary" id="summary"></div>
  <div class="summary" id="official"></div>
  <table>
    <thead><tr><th>Model</th><th>Provider</th><th>Type</th><th>Status</th><th>Latency</th><th>Uptime</th><th>Error</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
<script>
// Escape untrusted strings (provider error messages, status descriptions) before innerHTML
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
async function load() {
  const res = await fetch('/api/health/models');
  if (!res.ok) { document.getElementById('checkedAt').textContent = 'waiting for first check…'; return; }
  const data = await res.json();
  let uptimes = {};
  try {
    const upRes = await fetch('/api/health/uptime');
    if (upRes.ok) {
      (await upRes.json()).forEach(u => { uptimes[u.provider + '/' + u.model_name] = u; });
    }
  } catch (e) { /* uptime optional */ }
  // Hidden degradation alerts — problems the provider's status page doesn't report
  try {
    const insRes = await fetch('/api/health/insights');
    if (insRes.ok) {
      const hidden = (await insRes.json()).filter(i => i.hidden_degradation);
      document.getElementById('alerts').innerHTML = hidden.map(i =>
        `<div class="alert">⚠️ <strong>Hidden degradation:</strong> ${esc(i.model_name)} (${esc(i.provider)}) — ${esc(i.note)}</div>`
      ).join('');
    }
  } catch (e) { /* insights optional */ }
  // Official status pages vs our observation
  const official = data.official_status || [];
  const indicatorIcon = { none: '🟢', minor: '🟡', major: '🟠', critical: '🔴', unknown: '⚪' };
  document.getElementById('official').innerHTML = official.map(o => `
    <div class="stat">
      <div class="n">${indicatorIcon[o.indicator] || '⚪'}</div>
      <div class="l">${esc(o.provider)} official</div>
      <div class="official-note">${esc(o.description || o.indicator)}</div>
    </div>`).join('');
  document.getElementById('checkedAt').textContent = data.last_checked_at || '–';
  const s = data.summary;
  document.getElementById('summary').innerHTML = [
    ['Total', s.total_models], ['OK', s.ok_count], ['Slow', s.slow_count],
    ['Error', s.error_count], ['Unavailable', s.unavailable_count], ['Skipped', s.skipped_count]
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  document.getElementById('rows').innerHTML = data.models.map(m => {
    const u = uptimes[m.provider + '/' + m.model_name];
    const uptime = u && u.uptime_percent != null
      ? `<span class="${u.uptime_percent >= 99 ? 'ok' : (u.uptime_percent >= 90 ? 'slow' : 'error')} badge">${u.uptime_percent}%</span>`
      : '–';
    return `
    <tr>
      <td><strong>${esc(m.model_name)}</strong></td>
      <td>${esc(m.provider)}</td>
      <td>${esc(m.model_type)}</td>
      <td><span class="badge ${esc(m.status)}">${esc(m.status)}</span></td>
      <td>${m.latency_ms != null ? m.latency_ms + ' ms' : '–'}</td>
      <td>${uptime}</td>
      <td class="err" title="${esc(m.error_message)}">${esc(m.error_message)}</td>
    </tr>`;
  }).join('');
}
async function recheck() {
  document.getElementById('checkedAt').textContent = 'checking…';
  await fetch('/api/health/check', { method: 'POST' });
  load();
}

// ── 🔑 API key management (localhost only) ──
const PROVIDER_LABELS = { openai: 'OpenAI', anthropic: 'Anthropic', google: 'Google', xai: 'xAI' };
async function loadKeys() {
  try {
    const res = await fetch('/api/keys');
    if (!res.ok) { document.getElementById('keysSection').style.display = 'none'; return; }
    const keys = await res.json();
    const anyMissing = keys.some(k => !k.configured);
    if (anyMissing) document.getElementById('keysSection').open = true;
    document.getElementById('keyRows').innerHTML = keys.map(k => `
      <div class="keyrow">
        <span class="pname">${PROVIDER_LABELS[k.provider] || k.provider}</span>
        <span class="keysrc ${k.source}">${k.source === 'ui' ? '✓ set (dashboard)' : k.source === 'env' ? '✓ set (env var)' : 'not set'}</span>
        <span style="font-family:monospace;font-size:11px;color:#8b949e">${k.masked || ''}</span>
        <input type="password" id="key-${k.provider}" placeholder="paste API key…" autocomplete="off">
        <button onclick="saveKey('${k.provider}')">Save</button>
        ${k.source === 'ui' ? `<button onclick="removeKey('${k.provider}')">Remove</button>` : ''}
      </div>`).join('');
  } catch (e) { document.getElementById('keysSection').style.display = 'none'; }
}
async function saveKey(provider) {
  const input = document.getElementById('key-' + provider);
  const key = input.value.trim();
  if (!key) { input.focus(); return; }
  await fetch('/api/keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ provider, key })
  });
  input.value = '';
  document.getElementById('checkedAt').textContent = 'checking with new key…';
  setTimeout(() => { load(); loadKeys(); }, 4000);
  loadKeys();
}
async function removeKey(provider) {
  await fetch('/api/keys/' + provider, { method: 'DELETE' });
  setTimeout(() => { load(); loadKeys(); }, 4000);
  loadKeys();
}

load();
loadKeys();
setInterval(load, 60000);
</script>
</body>
</html>
